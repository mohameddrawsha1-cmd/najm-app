name: Build NAJM APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: flutter create --platforms=android --org com.najm --project-name najm .

      - name: Configure Android exact notifications and source fixes
        run: |
          python3 -m pip install --quiet --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          app = Path('lib/v4_app.dart')
          s = app.read_text()
          s = s.replace("GoalItem({required this.id, required this.title, this.why='', this.progress=0, List<String>? steps, List<bool>? done});", "GoalItem({required this.id, required this.title, this.why='', this.progress=0, List<String>? steps, List<bool>? done}) : steps = steps ?? [], done = done ?? [];")
          s = s.replace("class NajmStateData {\n  String displayName", "class NajmStateData {\n  NajmStateData();\n  String displayName")
          s = s.replace("ListTile(title:const Text('بدون تذكير'),onTap:()=>Navigator.pop(x,0))]))));", "ListTile(title:const Text('بدون تذكير'),onTap:()=>Navigator.pop(x,0))])))));")
          s = s.replace("child:const Text('سأتجاوزها الآن'))]))))));}", "child:const Text('سأتجاوزها الآن'))])))));}")
          app.write_text(s)

          main = Path('lib/main.dart')
          m = main.read_text().replace("anonKey: 'sb_publishable_pkW2bfGin6YApc1qVDTvsw_FFHi3X_Z'", "publishableKey: 'sb_publishable_pkW2bfGin6YApc1qVDTvsw_FFHi3X_Z'")
          main.write_text(m)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.VIBRATE',
          ]
          for perm in perms:
              if perm not in text:
                  text = text.replace(marker, marker + f'\n    <uses-permission android:name="{perm}"/>')
          text = text.replace('android:label="najm"', 'android:label="نجم"')
          if 'ScheduledNotificationReceiver' not in text:
              receivers = '''\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWER_ON"/>\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWER_ON"/>\n            </intent-filter>\n        </receiver>\n'''
              text = text.replace('    </application>', receivers + '    </application>')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in g:
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          if 'desugar_jdk_libs' not in g:
              g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          gradle.write_text(g)

          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for folder, size in sizes.items():
              img = Image.new('RGB', (size, size), '#05070A')
              d = ImageDraw.Draw(img)
              pad = max(3, size // 14)
              d.ellipse((pad,pad,size-pad,size-pad), fill='#11151B', outline='#E8B84E', width=max(2,size//24))
              font = ImageFont.truetype(font_path, max(12,int(size*0.26)))
              try:
                  box = d.textbbox((0,0),'نجم',font=font,direction='rtl',language='ar')
                  tw, th = box[2]-box[0], box[3]-box[1]
                  d.text(((size-tw)/2,(size-th)/2-box[1]),'نجم',font=font,fill='#FFD978',direction='rtl',language='ar')
              except Exception:
                  box = d.textbbox((0,0),'نجم',font=font)
                  tw, th = box[2]-box[0], box[3]-box[1]
                  d.text(((size-tw)/2,(size-th)/2-box[1]),'نجم',font=font,fill='#FFD978')
              img.save(Path('android/app/src/main/res')/folder/'ic_launcher.png')
          PY
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app source
        run: flutter analyze lib --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAJM-v4-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
