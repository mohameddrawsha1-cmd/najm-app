name: PHP quality checks
on:
  push:
    branches: [it-service-system]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
      - name: PHP syntax
        run: find app public routes scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke checks
        run: php tests/smoke.php
