services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: "بوابة تقنية المعلومات"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_TIMEZONE: Asia/Kuwait
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: it_service_management
      DB_USERNAME: it_app
      DB_PASSWORD: change_me_app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root
      MYSQL_DATABASE: it_service_management
      MYSQL_USER: it_app
      MYSQL_PASSWORD: change_me_app
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange_me_root"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
